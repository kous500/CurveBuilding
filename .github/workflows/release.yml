name: Release

# Run from the Actions tab ("Run workflow") on main. Builds and checks main, then tags the commit with the version
# and creates a draft release with the jars. A maintainer writes the release notes and publishes the draft.
# The tag is created only after every check passed, because tags cannot be moved or deleted (tags ruleset).
#
# Run on java-17 with the version of a release of main, it makes the release of java-17 for that version: the tag
# java-17-<version> and a draft release with the Fabric jars built with Java 17. java-17 must contain the changes of
# main up to the tag <version> and none after it.
#
# A dry run works on any branch and leaves nothing behind but the run: it builds with the version
# <version>-dry-run.g<commit>, written into the jars so that they cannot pass for the release, keeps them for
# 7 days and shows what the release would contain. It does not tag, create a release or attest the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.6.9, 0.7.0-alpha.1 or 0.7.0-rc.1
        type: string
        required: true
      dry-run:
        description: "Dry run: build and show the release without creating it"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build-version: ${{ steps.check.outputs.build-version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check the branch, the version format and the tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/java-17 ]; then
            echo "::error::Run the release workflow on main or java-17, not on $REF."
            exit 1
          fi
          # CONTRIBUTING.md: no v prefix, pre-releases use -alpha.N or -rc.N
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$'; then
            echo "::error::The version must look like 0.6.9, 0.7.0-alpha.1 or 0.7.0-rc.1."
            exit 1
          fi
          # matching-refs gives an empty list when there is no such tag; a failed request fails the step
          tag_commit() {
            gh api "repos/$REPO/git/matching-refs/tags/$1" --jq ".[] | select(.ref == \"refs/tags/$1\") | .object.sha"
          }
          tag=$VERSION
          if [ "$REF" = refs/heads/java-17 ]; then
            tag=java-17-$VERSION
            # The release of java-17 has the same changes of main as the release of main
            if [ "$DRY_RUN" != true ]; then
              main_tagged=$(tag_commit "$VERSION")
              if [ -z "$main_tagged" ]; then
                echo "::error::There is no tag $VERSION. Release $VERSION from main first."
                exit 1
              fi
              merge_base=$(gh api "repos/$REPO/compare/main...$SHA" --jq .merge_base_commit.sha)
              if [ "$merge_base" != "$main_tagged" ]; then
                echo "::error::java-17 must contain the changes of main up to the tag $VERSION and none after it. Merge the tag into java-17 (see CONTRIBUTING.md)."
                exit 1
              fi
            fi
          fi
          # A tag on this commit is left over from a run that failed later, which may be run again
          tagged=$(tag_commit "$tag")
          if [ -n "$tagged" ] && [ "$tagged" != "$SHA" ]; then
            echo "::error::The tag $tag already exists on another commit."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "build-version=$VERSION-dry-run.g${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "build-version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      release-version: ${{ needs.check.outputs.build-version }}
    permissions:
      contents: read

  preview:
    name: Show the release (dry run)
    if: ${{ inputs.dry-run }}
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For the pull requests since the previous release
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: artifact

      - name: Collect the jars and write their checksums
        run: |
          mkdir dry-run
          find artifact -name '*.jar' -exec mv {} dry-run/ \;
          cd dry-run
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run
          path: dry-run/
          if-no-files-found: error
          retention-days: 7

      # The build keeps the jars in the run for this job. Anyone signed in to GitHub can download artifacts of a
      # public repository, so they are deleted once this job has used them. A failed job keeps them for a re-run.
      - name: Delete the jars kept by the build
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "jars") | .id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done

      - name: Show what the release would contain
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same previous release as in the release-notes skill: of the releases of the same branch, for a release
          # the latest one that is not a pre-release; for a pre-release, the latest one of any kind
          if [ "$REF" = refs/heads/java-17 ]; then
            branch='startswith("java-17-")'
          else
            branch='startswith("java-17-") | not'
          fi
          case "$VERSION" in
            *-*) prerelease=yes; kind=true ;;
            *) prerelease=no; kind='.isPrerelease | not' ;;
          esac
          previous=$(gh release list --repo "$REPO" --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq "[.[] | select((.tagName | $branch) and ($kind))][0].tagName // empty")
          {
            echo "## Dry run of $TAG"
            echo
            echo "Nothing was tagged or released. The jars (named with the dry-run version) are kept in the \`dry-run\` artifact for 7 days."
            echo
            echo "- Tag: \`$TAG\` on \`${GITHUB_SHA:0:7}\`"
            echo "- Pre-release: $prerelease"
            echo "- Previous release: \`${previous:-none}\`"
            echo
            echo "### Files"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for file in dry-run/*; do
              echo "| \`$(basename "$file")\` | $(du -h "$file" | cut -f1) |"
            done
            echo
            echo "### Pull requests since $previous"
            echo
            if [ -n "$previous" ]; then
              git log --first-parent --format='- %s' "$previous..HEAD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the draft release
    if: ${{ !inputs.dry-run }}
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: artifact

      - name: Collect the jars and write their checksums
        run: |
          mkdir release
          find artifact -name '*.jar' -exec mv {} release/ \;
          cd release
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS

      # Lets anyone check that a jar was built by this workflow: gh attestation verify <jar> --repo <repository>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.jar

      - name: Tag the commit
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # An empty list when there is no such tag; a failed request fails the step
          tagged=$(gh api "repos/$REPO/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -z "$tagged" ]; then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          elif [ "$tagged" != "$SHA" ]; then
            echo "::error::The tag $TAG already exists on another commit."
            exit 1
          fi

      # The release of java-17 is never marked as the latest release, which stays the one of main
      - name: Create the draft release
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists."
            exit 1
          fi
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          if [ "$REF" = refs/heads/java-17 ]; then
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$VERSION for Java 17" --latest=false \
              --notes "" $prerelease release/*.jar release/SHA256SUMS
          else
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$VERSION" \
              --generate-notes $prerelease release/*.jar release/SHA256SUMS
          fi
          echo "Draft release created. Write the release notes and publish it." >> "$GITHUB_STEP_SUMMARY"

      # The build keeps the jars in the run for this job. Anyone signed in to GitHub can download artifacts of a
      # public repository, so they are deleted once this job has used them. A failed job keeps them for a re-run.
      - name: Delete the jars kept by the build
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "jars") | .id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
