name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Called by the release workflow, which uses the jars of a successful run
  workflow_call:
    inputs:
      release-version:
        description: Version of the release; the jars are kept for the calling workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Gradle does not find the JDKs installed by setup-java by itself; they are passed through these variables.
  # Gradle runs on JDK 25 (JAVA_HOME), and Minecraft 1.21.x is compiled with JDK 21.
  GRADLE_TOOLCHAINS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
  # Empty except when called by the release workflow
  RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
  build:
    name: Build and unit tests
    # Draft pull requests are not built; marking one ready for review starts the build.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Without the Gradle cache, downloading Minecraft and the dependencies has taken over 25 minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build version is made from the latest release tag (git describe)
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # The last one becomes JAVA_HOME
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The Gradle home is cached by the steps below. setup-gradle's default provider is a commercial service,
          # and its basic provider starts from an empty cache whenever a build file changes.
          cache-disabled: true

      # The key changes with the build files; without an exact match the latest cache is used, so a pull request
      # that changes a build file downloads only what is new. Only this job saves it, and only on main.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check that the Fabric sources are in the Stonecutter vcsVersion state
        run: |
          ./gradlew $GRADLE_TOOLCHAINS ":curvebuilding-fabric:Reset active project"
          if ! git diff --exit-code; then
            echo "::error::The Fabric sources are not in the state of Stonecutter's vcsVersion. Run the 'Reset active project' task and commit the result."
            exit 1
          fi

      - name: Build
        run: ./gradlew $GRADLE_TOOLCHAINS ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION} build

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "*/build/reports/tests/"
          retention-days: 14

      - name: List the built jars
        run: |
          {
            echo "## Built jars"
            echo
            echo "| Jar | Size |"
            echo "|---|---|"
            for jar in curvebuilding-bukkit/build/libs/*.jar curvebuilding-fabric/versions/*/build/libs/*.jar; do
              case "$jar" in *-sources.jar) continue ;; esac
              echo "| \`$(basename "$jar")\` | $(du -h "$jar" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the jars for the release
        if: ${{ env.RELEASE_VERSION != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: |
            curvebuilding-bukkit/build/libs/*.jar
            curvebuilding-fabric/versions/*/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 1

      # The build does not set up the other versions in the jars' ranges (fabric-test-runs), which the other jobs
      # run on. Configuring them downloads their Minecraft.
      - name: Set up the fabric-test-runs versions for the cache
        if: ${{ github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: ./gradlew $GRADLE_TOOLCHAINS -PtestRuns help

      - name: Stop Gradle before saving the cache
        if: ${{ github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: ./gradlew --stop

      - name: Save the Gradle cache
        if: ${{ github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  server:
    name: Fabric server startup (${{ matrix.minecraft }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.10"
            task: ":curvebuilding-fabric:1.21.10:runServer"
          - minecraft: "1.21.11"
            task: ":curvebuilding-fabric:1.21.11:runServer"
          - minecraft: "26.3"
            task: ":curvebuilding-fabric:26.3:runServer"
          # The 26.1 - 26.3 jar on the oldest version of its range
          - minecraft: "26.1"
            task: ":fabric-test-runs:26.1:runServer"
            args: -PtestRuns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build version is made from the latest release tag (git describe)
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Saved by the build job
      - name: Restore the Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Start the server and wait until it is ready
        env:
          MINECRAFT: ${{ matrix.minecraft }}
          TASK: ${{ matrix.task }}
          ARGS: ${{ matrix.args }}
        run: |
          run_dir="curvebuilding-fabric/run/$MINECRAFT"
          mkdir -p "$run_dir"
          echo "eula=true" > "$run_dir/eula.txt"

          ./gradlew $GRADLE_TOOLCHAINS ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION} $ARGS "$TASK" > server.log 2>&1 &
          gradle_pid=$!

          # The time limit starts when Gradle runs the task: before that, Gradle may be downloading Minecraft and the
          # dependencies, which without the cache has taken over 20 minutes. The job's timeout covers that part.
          # The server is killed instead of stopped: PacketSender's timer keeps its JVM running after the stop
          # command. Loom starts the server through the dev launch injector.
          waited=0
          while [ "$waited" -lt 600 ]; do
            if grep -q 'Done (' server.log; then
              grep -E '^\s+- (curvebuilding|worldedit) ' server.log || true
              if grep -qE '^\s+- curvebuilding ' server.log; then
                echo "The server started with CurveBuilding loaded."
                pkill -f net.fabricmc.devlaunchinjector.Main || true
                exit 0
              fi
              echo "::error::The server started, but CurveBuilding was not loaded."
              exit 1
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              echo "::error::The server stopped before it was ready."
              exit 1
            fi
            sleep 5
            if grep -qF "> Task $TASK" server.log; then
              waited=$((waited + 5))
            fi
          done
          echo "::error::The server was not ready within 10 minutes of starting $TASK."
          exit 1

      - name: Show the server log
        if: ${{ always() }}
        run: cat server.log

  gametest:
    name: Fabric game tests (${{ matrix.minecraft }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.10"
            task: ":curvebuilding-fabric:1.21.10:runGameTest"
            dir: curvebuilding-fabric/versions/1.21.10
          - minecraft: "1.21.11"
            task: ":curvebuilding-fabric:1.21.11:runGameTest"
            dir: curvebuilding-fabric/versions/1.21.11
          - minecraft: "26.3"
            task: ":curvebuilding-fabric:26.3:runGameTest"
            dir: curvebuilding-fabric/versions/26.3
          # The 26.1 - 26.3 jar and its tests on the oldest version of its range
          - minecraft: "26.1"
            task: ":fabric-test-runs:26.1:runGameTest"
            args: -PtestRuns
            dir: fabric-test-runs/26.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build version is made from the latest release tag (git describe)
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Saved by the build job
      - name: Restore the Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The tests in curvebuilding-fabric/src/gametest, on a server with WorldEdit
      - name: Run the game tests
        env:
          TASK: ${{ matrix.task }}
          ARGS: ${{ matrix.args }}
        run: ./gradlew $GRADLE_TOOLCHAINS ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION} $ARGS "$TASK"

      - name: Upload the server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gametest-log-${{ matrix.minecraft }}
          path: ${{ matrix.dir }}/build/run/gameTest/logs/
          retention-days: 14

  bukkit-server:
    name: Bukkit server startup (${{ matrix.minecraft }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest version the plugin is published for (BUKKIT_GAME_VERSIONS in publish.yml), each
        # on the latest Paper build with a WorldEdit for Bukkit that supports it. WorldEdit is named by its Modrinth
        # version ID: its Fabric and Bukkit releases share version numbers.
        include:
          - minecraft: "1.20.2"
            java: 21
            worldedit: Bu1zaaoc # 7.3.9
          - minecraft: "26.3"
            java: 25
            worldedit: YFnqiUlL # 7.4.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build version is made from the latest release tag (git describe)
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Saved by the build job
      - name: Restore the Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the plugin
        run: ./gradlew $GRADLE_TOOLCHAINS ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION} :curvebuilding-bukkit:assemble

      - name: Download Paper and WorldEdit
        env:
          MINECRAFT: ${{ matrix.minecraft }}
          WORLDEDIT: ${{ matrix.worldedit }}
        run: |
          # Both APIs ask clients to name themselves
          agent="kous500/CurveBuilding CI (https://github.com/kous500/CurveBuilding)"
          mkdir -p paper/plugins

          build=$(curl -fsSL -A "$agent" "https://fill.papermc.io/v3/projects/paper/versions/$MINECRAFT/builds/latest")
          echo "Paper $MINECRAFT build $(jq -r '.id' <<< "$build")"
          curl -fsSL -A "$agent" -o paper/paper.jar "$(jq -r '.downloads."server:default".url' <<< "$build")"
          echo "$(jq -r '.downloads."server:default".checksums.sha256' <<< "$build")  paper/paper.jar" | sha256sum -c -

          version=$(curl -fsSL -A "$agent" "https://api.modrinth.com/v2/version/$WORLDEDIT")
          echo "WorldEdit $(jq -r '.version_number' <<< "$version") for $(jq -r '.loaders | join(", ")' <<< "$version")"
          curl -fsSL -A "$agent" -o paper/plugins/WorldEdit.jar "$(jq -r '.files[0].url' <<< "$version")"
          echo "$(jq -r '.files[0].hashes.sha512' <<< "$version")  paper/plugins/WorldEdit.jar" | sha512sum -c -

          cp curvebuilding-bukkit/build/libs/curvebuilding-bukkit-*.jar paper/plugins/
          echo "eula=true" > paper/eula.txt
          # Keeps the CI servers out of the plugins' usage statistics (bStats, used by WorldEdit)
          mkdir -p paper/plugins/bStats
          echo "enabled: false" > paper/plugins/bStats/config.yml

      - name: Start the server, reload the plugin and stop the server
        working-directory: paper
        env:
          JAVA: ${{ matrix.java }}
        run: |
          java_home="JAVA_HOME_${JAVA}_X64"
          status=0
          # Waits for the server to be ready, then types the commands into its console. Paper also downloads the
          # vanilla server on its first start.
          (
            for _ in $(seq 1 600); do
              grep -q 'Done (' server.log 2>/dev/null && break
              sleep 1
            done
            echo "curvebuilding reload"
            sleep 5
            echo "stop"
          ) | timeout 900 "${!java_home}/bin/java" -Xmx2G -jar paper.jar --nogui > server.log 2>&1 || status=$?

          if ! grep -q 'Done (' server.log; then
            echo "::error::The server did not start."
            exit 1
          fi
          if ! grep -q '\[CurveBuilding\] Enabling CurveBuilding' server.log; then
            echo "::error::CurveBuilding was not enabled."
            exit 1
          fi
          if ! grep -q '\[CurveBuilding\] Reloaded curvebuilding.' server.log; then
            echo "::error::The curvebuilding reload command did not work."
            exit 1
          fi
          # A library that fails to load, ParticleNativeAPI for example, is only logged as a warning
          if grep -E '^\[[0-9:]+ (WARN|ERROR)\]: \[CurveBuilding\]|me\.kous500\.curvebuilding' server.log; then
            echo "::error::CurveBuilding logged a warning or an error."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The server did not stop by itself (exit status $status)."
            exit 1
          fi
          echo "CurveBuilding was enabled and reloaded, and the server stopped."

      - name: Show the server log
        if: ${{ always() }}
        run: cat paper/server.log || true

  ci-passed:
    name: CI passed
    # The main ruleset requires this job instead of each job above, so it does not change when a Minecraft
    # version is added to the matrix. It runs even when a job above fails, and fails then.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [build, server, gametest, bukkit-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the other jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A job did not succeed (results: $RESULTS)."
              exit 1
            fi
          done
