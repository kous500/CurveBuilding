// Runs a built CurveBuilding Fabric jar on another Minecraft version in its range, to test the range in development.
// These projects have no sources and build nothing; they are only included with -PtestRuns (see settings.gradle).
// runClient and runServer start the jar; runGameTest runs the game tests of its project on this version.
// Each <minecraft version>/gradle.properties names the Minecraft version, its dependencies and the jar to run.
// On a version that needs remapping (1.21.11 and older), the jar is the development jar of its project, with the names
// of the Mojang mappings rather than the intermediary names of the released jar: Loom remaps a mod dependency while it
// configures the project, before the jar is built. It runs here as long as the classes and members it uses have the
// same names in this version.
def minecraftVersion = project.property("minecraft_version") as String
def javaVersion = (project.property("java_version") as String).toInteger()
def jarProject = project.property("jar_project") as String
def obfuscated = (project.findProperty("obfuscated") ?: "false").toString().toBoolean()

apply plugin: obfuscated ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom"

evaluationDependsOn(jarProject)
def modJar = project(jarProject).tasks.named("jar")
def modDependency = obfuscated ? "modImplementation" : "implementation"
// The game tests of the same project, compiled for its Minecraft version, run here with runGameTest
def gametestJar = project(jarProject).tasks.named("gametestJar")

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
}

// Before dependencies: it creates the gametest source set and its configurations
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "curvebuilding-test-runs"
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
    }
    add(modDependency, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modDependency, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    add(modDependency, "com.sk89q.worldedit:${project.worldedit_artifact}:${project.worldedit_version}")

    localRuntime files(modJar.flatMap { it.archiveFile }).builtBy(modJar)
    if (obfuscated) {
        // The development jar does not have the libraries that the released jar has inside
        localRuntime project(":curvebuilding-core")
        localRuntime "org.yaml:snakeyaml:2.7"
    }
    gametestRuntimeOnly files(gametestJar.flatMap { it.archiveFile }).builtBy(gametestJar)
}

loom {
    runConfigs.configureEach {
        // Not for the game tests: their directory (build/run/gameTest) is deleted before each run.
        if (name != "gameTest") {
            runDir = "../../curvebuilding-fabric/run/${minecraftVersion}"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

// The remap tasks exist on the versions that need remapping
tasks.matching { it.name in ["jar", "remapJar", "remapSourcesJar"] }.configureEach {
    enabled = false
}
