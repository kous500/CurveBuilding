// Runs a built CurveBuilding Fabric jar on another Minecraft version in its range, to test the range in development.
// These projects have no sources and build nothing; they are only included with -PtestRuns (see settings.gradle).
// Each <minecraft version>/gradle.properties names the Minecraft version, its dependencies and the jar to run.
// Only versions that need no remapping (26.1 and newer) are supported.
apply plugin: "net.fabricmc.fabric-loom"

def minecraftVersion = project.property("minecraft_version") as String
def javaVersion = (project.property("java_version") as String).toInteger()
def jarProject = project.property("jar_project") as String

evaluationDependsOn(jarProject)
def modJar = project(jarProject).tasks.named("jar")

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.sk89q.worldedit:${project.worldedit_artifact}:${project.worldedit_version}"

    localRuntime files(modJar.flatMap { it.archiveFile }).builtBy(modJar)
}

loom {
    runConfigs.configureEach {
        ideConfigGenerated = true
        runDir = "../../curvebuilding-fabric/run/${minecraftVersion}"
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.named("jar") {
    enabled = false
}
