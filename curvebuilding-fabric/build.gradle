// Shared build script for every Minecraft version in versions/<version>/.
def minecraftVersion = stonecutter.current.version
def javaVersion = (project.property("java_version") as String).toInteger()
// The jar is compiled against minecraftVersion and runs on every version from minecraft_min to minecraft_max.
// Both ends must be tested; see "Jar names" in CONTRIBUTING.md.
def minecraftMin = project.property("minecraft_min") as String
def minecraftMax = project.property("minecraft_max") as String
def minecraftRange = minecraftMin == minecraftMax ? minecraftMin : "${minecraftMin}-${minecraftMax}"
def minecraftDependency = minecraftMin == minecraftMax ? minecraftMin : ">=${minecraftMin} <=${minecraftMax}"
// Minecraft 1.21.11 and older are obfuscated and need remapping; 26.1 and newer are not.
def obfuscated = (project.property("obfuscated") as String).toBoolean()

apply plugin: obfuscated ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom"

base {
    archivesName = "curvebuilding-fabric"
}
version = "${rootProject.version}+${minecraftRange}"

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
}

def modDependency = obfuscated ? "modImplementation" : "implementation"

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
    }
    add(modDependency, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modDependency, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    add(modDependency, "com.sk89q.worldedit:${project.worldedit_artifact}:${project.worldedit_version}")
    compileOnly "org.jetbrains:annotations:26.1.0"
    include "org.yaml:snakeyaml:2.2"

    implementation project(":curvebuilding-core")
    include project(":curvebuilding-core")
}

// Game tests in src/gametest run on a real server with runGameTest (see CONTRIBUTING.md).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "curvebuilding-gametest"
        enableClientGameTests = false
        eula = true
        // Every run starts from an empty build/run/gameTest, so the tests see what a new installation sees
        clearRunDirectory = true
    }
}

// Loom makes check (and so build) run the game tests, which start a server for each Minecraft version. They run
// only when asked for (runGameTest, a CI job of its own, or allTests); build still compiles them.
tasks.named("runGameTest") {
    onlyIf("runGameTest or allTests was asked for") {
        gradle.startParameter.taskNames.any {
            it in ["runGameTest", "allTests"] || it.endsWith(":runGameTest") || it.endsWith(":allTests")
        }
    }
}

// The game tests as a mod jar, for running them on another Minecraft version in the jar's range (fabric-test-runs)
tasks.register("gametestJar", Jar) {
    archiveClassifier = "gametest"
    from sourceSets.gametest.output
}

loom {
    // The access widener differs between Minecraft versions, so each version has its own.
    accessWidenerPath = file("curvebuilding.accesswidener")
    runConfigs.configureEach {
        ideConfigGenerated = true
        // Separate per version, so a world is not upgraded by a newer version and mods of other versions are not loaded.
        // Not for the game tests: their directory (build/run/gameTest) is deleted before each run.
        if (name != "gameTest") {
            runDir = "../../run/${minecraftVersion}"
        }
    }
}

processResources {
    def props = [version: version, minecraft_dependency: minecraftDependency]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand props
    }
    from(loom.accessWidenerPath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}
