// Shared build script for every Minecraft version in versions/<version>/.
plugins {
    id "fabric-loom" version "1.13.6"
}

def minecraftVersion = stonecutter.current.version
def javaVersion = (project.property("java_version") as String).toInteger()

base {
    archivesName = "curvebuilding-fabric"
}
version = "${rootProject.version}+${minecraftVersion}"

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "com.sk89q.worldedit:${project.worldedit_artifact}:${project.worldedit_version}"
    compileOnly "org.jetbrains:annotations:24.1.0"
    include "org.yaml:snakeyaml:2.2"

    implementation project(":curvebuilding-core")
    include project(":curvebuilding-core")
}

loom {
    accessWidenerPath = rootProject.file("curvebuilding-fabric/src/main/resources/curvebuilding.accesswidener")
    runConfigs.configureEach {
        ideConfigGenerated = true
        runDir = "../../run"
    }
}

processResources {
    def props = [version: version, minecraft_version: minecraftVersion]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand props
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}
