// Shared build script for every Minecraft version in versions/<version>/.
def minecraftVersion = stonecutter.current.version
def javaVersion = (project.property("java_version") as String).toInteger()
// Minecraft 1.21.11 and older are obfuscated and need remapping; 26.1 and newer are not.
def obfuscated = (project.property("obfuscated") as String).toBoolean()

apply plugin: obfuscated ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom"

base {
    archivesName = "curvebuilding-fabric"
}
version = "${rootProject.version}+${minecraftVersion}"

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
}

def modDependency = obfuscated ? "modImplementation" : "implementation"

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
    }
    add(modDependency, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modDependency, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    add(modDependency, "com.sk89q.worldedit:${project.worldedit_artifact}:${project.worldedit_version}")
    compileOnly "org.jetbrains:annotations:24.1.0"
    include "org.yaml:snakeyaml:2.2"

    implementation project(":curvebuilding-core")
    include project(":curvebuilding-core")
}

loom {
    // The access widener differs between Minecraft versions, so each version has its own.
    accessWidenerPath = file("curvebuilding.accesswidener")
    runConfigs.configureEach {
        ideConfigGenerated = true
        // Separate per version, so a world is not upgraded by a newer version and mods of other versions are not loaded
        runDir = "../../run/${minecraftVersion}"
    }
}

processResources {
    def props = [version: version, minecraft_version: minecraftVersion]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand props
    }
    from(loom.accessWidenerPath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}
