plugins {
    id "java"
    id "checkstyle"
    // Applied per Minecraft version in curvebuilding-fabric/build.gradle
    id "net.fabricmc.fabric-loom" version "1.18.4" apply false
    id "net.fabricmc.fabric-loom-remap" version "1.18.4" apply false
}

// The release workflow passes the version of the release tag (-PreleaseVersion). Other builds are named after
// the latest release tag and the commit, as `git describe` prints them, e.g. 0.6.8-5-g3db5589 or
// 0.6.8-5-g3db5589-dirty with uncommitted changes. Without Git history the version is 0.0.0-SNAPSHOT.
def describedVersion() {
    try {
        def output = providers.exec {
            commandLine "git", "describe", "--tags", "--dirty", "--match", "[0-9]*"
            ignoreExitValue = true
        }
        return output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        // Git is not installed
        return null
    }
}

def buildVersion = providers.gradleProperty("releaseVersion").getOrNull() ?: describedVersion() ?: "0.0.0-SNAPSHOT"

allprojects {
    group = "me.kous500.curvebuilding"
    version = buildVersion
}

// runServer gets a server.properties that runClient, which plays under an offline name, can join from this computer
// only; Minecraft's defaults would keep it out. An existing file is left as it is.
subprojects {
    tasks.matching { it.name == "runServer" }.configureEach {
        doFirst {
            def properties = file("${loom.runConfigs.getByName("server").runDir}/server.properties")
            if (!properties.exists()) {
                properties.parentFile.mkdirs()
                properties.text = "online-mode=false\nserver-ip=127.0.0.1\nwhite-list=false\n"
            }
        }
    }
}

// ./gradlew checkCodeStyle: config/checkstyle/checkstyle.xml on the sources of every module. Violations are warnings
// only: the task lists them and succeeds, and `build` does not run it. CI shows them on the pull request.
// The Fabric sources are checked once, as committed, rather than once per Minecraft version.
repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = "14.3.0"
}

tasks.register("checkCodeStyle", Checkstyle) {
    group = "verification"
    description = "Lists where the Java sources of every module break the code style."
    source = fileTree(rootDir) {
        include "curvebuilding-*/src/**/*.java"
    }
    classpath = files()
}

// ./gradlew allTests: the unit tests and the Fabric game tests on every Minecraft version, including the oldest
// version of each jar's range (fabric-test-runs, which settings.gradle includes for this task)
tasks.register("allTests") {
    group = "verification"
    description = "Runs the unit tests and the Fabric game tests on every built Minecraft version."
    dependsOn subprojects.collect { project -> project.tasks.matching { it.name in ["test", "runGameTest"] } }
}
