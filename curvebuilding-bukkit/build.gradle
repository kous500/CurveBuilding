plugins {
    id "java-library"
    id "com.gradleup.shadow" version "9.6.1"
}

repositories {
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
    maven {
        url = uri("https://repo.maven.apache.org/maven2/")
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT"
    compileOnly("com.sk89q.worldedit:worldedit-bukkit:7.4.2") {
        exclude group: 'com.google.guava', module: 'guava'
    }
    compileOnly "org.jspecify:jspecify:1.0.1"
    api "com.github.fierioziy.particlenativeapi:ParticleNativeAPI-core:4.5.1"
    api project(':curvebuilding-core')
}

// The plugin jar, with core, ParticleNativeAPI and SnakeYAML inside. It takes the name of the plain jar, which is
// not built.
shadowJar {
    archiveClassifier = ""
}

jar {
    enabled = false
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = "UTF-8"
    filesMatching("plugin.yml") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.code.gson:gson:2.15.0'
    }
}
