pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "KikuGie"
            url = "https://maven.kikugie.dev/releases"
        }
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.9.8"
}

rootProject.name = "CurveBuilding"
include ":curvebuilding-core", ":curvebuilding-bukkit", ":curvebuilding-fabric"

stonecutter {
    centralScript = "build.gradle"
    kotlinController = false

    // Minecraft versions built by the Fabric module. Each has curvebuilding-fabric/versions/<version>/gradle.properties.
    create(":curvebuilding-fabric") {
        versions "1.21.10", "1.21.11", "26.3"
        vcsVersion = "1.21.10"
    }
}
