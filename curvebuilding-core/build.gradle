plugins {
    id "java"
}

repositories {
    maven {
        name = "enginehub-maven"
        url = uri("https://maven.enginehub.org/repo/")
    }
    mavenCentral()
}

dependencies {
    compileOnly("com.sk89q.worldedit:worldedit-bukkit:7.4.2") {
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation 'org.yaml:snakeyaml:2.7'
    compileOnly "org.jspecify:jspecify:1.0.1"

    testImplementation "com.sk89q.worldedit:worldedit-core:7.4.2"
    testCompileOnly "org.jspecify:jspecify:1.0.1"
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
    // MessageFilesTest reads the message files of the platform modules
    ["curvebuilding-bukkit", "curvebuilding-fabric"].each { module ->
        inputs.dir(file("../$module/src/main/resources/messages"))
                .withPropertyName("${module}-messages")
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // Gradle runs on Java 25, so pin the bytecode level to the oldest Java that a jar with core inside runs on: Java
    // 17, which Minecraft asks for on Fabric 1.20 - 1.20.4
    options.release = 17
}

// WorldEdit 7.4.2, which core compiles against, is published for Java 21, and Gradle would refuse it for Java 17 code.
// The game tests on 1.20 check that what core calls is also in the WorldEdit for those versions, which runs on Java 17.
["compileClasspath", "testCompileClasspath", "testRuntimeClasspath"].each { name ->
    configurations.named(name) {
        attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}
